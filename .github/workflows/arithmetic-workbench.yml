name: Arithmetic workbench export (temporary)
on:
  push:
    branches: [agent/arithmetic-garden-r1]
    paths: [.github/workflows/arithmetic-workbench.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Package exact source and pinned dependencies (no credentials)
        run: |
          git rev-parse HEAD > WORKBENCH_SOURCE_SHA
          tar --exclude='./.git' -czf "$RUNNER_TEMP/garden-workbench.tgz" .
      - uses: actions/upload-artifact@v4
        with:
          name: arithmetic-workbench
          path: ${{ runner.temp }}/garden-workbench.tgz
          retention-days: 1
