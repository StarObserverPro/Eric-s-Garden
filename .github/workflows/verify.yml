name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Classify WebGPU architecture scope
        id: webgpu_scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "desktop_hud_required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | tee /tmp/changed-files.txt
          if grep -Eq '^(src/main\.ts|src/render/runtime\.ts|src/render/contract\.ts|src/render/vgpu/vgpu-renderer\.ts|src/render/vgpu/quality-bundles\.ts|src/render/vgpu/raw/|package\.json|package-lock\.json|vite\.config\.ts|\.github/workflows/verify\.yml)$' /tmp/changed-files.txt; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi

          if grep -Eq '^(index\.html|styles\.css|src/ui/desktop-hud\.(ts|css)|src/ui/portrait-mobile\.ts|tests/desktop-hud-browser-evidence\.js|\.github/workflows/verify\.yml)$' /tmp/changed-files.txt; then
            echo "desktop_hud_required=true" >> "$GITHUB_OUTPUT"
          else
            echo "desktop_hud_required=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Install the verified portable CPU renderer
        run: npx vgpu install-software-renderer
      - name: Prove the headless renderer is healthy
        run: npx vgpu doctor --pretty
      - name: Shader, model, mock, Node and production checks
        run: npm run check
      - name: Capture deterministic soil evidence
        run: |
          mkdir -p browser-evidence
          SOIL_EVIDENCE_PATH=browser-evidence/soil-node.ppm npx vitest run tests/soil-render-node.test.ts
          test -s browser-evidence/soil-node.ppm
      - name: Capture VGPU meadow sky and grass evidence
        run: |
          mkdir -p browser-evidence
          MEADOW_EVIDENCE_PATH=browser-evidence/meadow-node.ppm npx vitest run tests/meadow-render-node.test.ts
          test -s browser-evidence/meadow-node.ppm
      - name: Capture VGPU hardscape evidence
        run: |
          mkdir -p browser-evidence
          HARDSCAPE_EVIDENCE_PATH=browser-evidence/hardscape-node.ppm npx vitest run tests/hardscape-render-node.test.ts
          test -s browser-evidence/hardscape-node.ppm
      - name: Capture VGPU crop visual evidence
        run: |
          mkdir -p browser-evidence
          CROP_LINEUP_EVIDENCE_PATH=browser-evidence/crop-lineup-node.ppm \
          PUMPKIN_EVIDENCE_PATH=browser-evidence/pumpkin-closeup-node.ppm \
            npx vitest run tests/crop-render-node.test.ts
          test -s browser-evidence/crop-lineup-node.ppm
          test -s browser-evidence/pumpkin-closeup-node.ppm
      - name: Capture botanical crop detail evidence
        run: |
          mkdir -p browser-evidence
          CROP_NODE_EVIDENCE_PATH=browser-evidence/crop-node-detail-node.ppm \
          CROP_ROSETTE_EVIDENCE_PATH=browser-evidence/crop-rosette-detail-node.ppm \
            npx vitest run tests/crop-botany-render-node.test.ts
          test -s browser-evidence/crop-node-detail-node.ppm
          test -s browser-evidence/crop-rosette-detail-node.ppm
      - name: Capture production crop-soil contact evidence
        run: |
          mkdir -p browser-evidence
          CROP_SOIL_EVIDENCE_PATH=browser-evidence/crop-soil-contact-node.ppm \
            npx vitest run tests/crop-soil-contact-node.test.ts
          test -s browser-evidence/crop-soil-contact-node.ppm
      - name: Install WebGPU browser probe for renderer architecture changes
        if: steps.webgpu_scope.outputs.required == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers xvfb xauth
          npm install --global agent-browser@0.33.0
          agent-browser doctor --webgpu --headed
      - name: Prove the production vgpu browser path
        if: steps.webgpu_scope.outputs.required == 'true'
        run: |
          set -euo pipefail
          mkdir -p browser-evidence
          setsid npx vite preview --host 127.0.0.1 --port 4173 --strictPort >browser-evidence/vite-webgpu.log 2>&1 &
          SERVER_PID=$!
          SESSION="eric-webgpu-${GITHUB_RUN_ID}"
          cleanup() {
            agent-browser --session "$SESSION" close >/dev/null 2>&1 || true
            kill -- -"$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null

          agent-browser --session "$SESSION" --webgpu --headed open http://127.0.0.1:4173/
          agent-browser --session "$SESSION" --webgpu --headed wait 6000
          agent-browser --session "$SESSION" --webgpu --headed eval \
            'new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)))'

          agent-browser --session "$SESSION" --webgpu --headed eval \
            'Boolean(navigator.gpu)' | tee browser-evidence/webgpu-capability.txt
          grep -q 'true' browser-evidence/webgpu-capability.txt

          agent-browser --session "$SESSION" --webgpu --headed eval \
            'document.getElementById("rendererName")?.textContent ?? ""' | tee browser-evidence/webgpu-renderer.txt
          grep -q 'vgpu · WebGPU' browser-evidence/webgpu-renderer.txt

          agent-browser --session "$SESSION" --webgpu --headed eval \
            'document.getElementById("rendererIndicator")?.dataset.status ?? ""' | tee browser-evidence/webgpu-status.txt
          grep -q 'ready' browser-evidence/webgpu-status.txt

          agent-browser --session "$SESSION" --webgpu --headed eval \
            'document.getElementById("rendererMessage")?.textContent ?? ""' | tee browser-evidence/webgpu-message.txt
          ! grep -Eq '初始化没有成功|没有可用的 WebGPU|画面中断' browser-evidence/webgpu-message.txt

          agent-browser --session "$SESSION" --webgpu --headed screenshot browser-evidence/garden-webgpu.png
          test -s browser-evidence/garden-webgpu.png
      - name: Capture the playable Canvas fallback
        env:
          DESKTOP_HUD_EVIDENCE_REQUIRED: ${{ steps.webgpu_scope.outputs.desktop_hud_required }}
        run: |
          set -euo pipefail
          mkdir -p browser-evidence
          setsid npx vite preview --host 127.0.0.1 --port 4174 --strictPort >browser-evidence/vite.log 2>&1 &
          SERVER_PID=$!
          trap 'kill -- -"$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then
              break
            fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:4174/ >/dev/null

          if [[ "$DESKTOP_HUD_EVIDENCE_REQUIRED" == "true" ]]; then
            node --check tests/desktop-hud-browser-evidence.js
            if ! command -v agent-browser >/dev/null 2>&1; then
              npm install --global agent-browser@0.33.0
            fi
            cp dist/index.html dist/desktop-hud-evidence.html
            cp tests/desktop-hud-browser-evidence.js dist/desktop-hud-browser-evidence.js
            python3 - <<'PY'
          from pathlib import Path

          path = Path("dist/desktop-hud-evidence.html")
          html = path.read_text(encoding="utf-8")
          marker = "</body>"
          injected = '<script src="/desktop-hud-browser-evidence.js"></script>\n</body>'
          if marker not in html:
              raise SystemExit("desktop HUD evidence page is missing </body>")
          path.write_text(html.replace(marker, injected, 1), encoding="utf-8")
          PY

            for VIEWPORT in 1906x937 1440x900 1280x800; do
              WIDTH="${VIEWPORT%x*}"
              HEIGHT="${VIEWPORT#*x}"
              SCREENSHOT="browser-evidence/garden-fallback-${VIEWPORT}.png"
              STATUS_FILE="browser-evidence/garden-hud-status-${VIEWPORT}.txt"
              REPORT_FILE="browser-evidence/garden-hud-report-${VIEWPORT}.json"
              SESSION="eric-canvas-${GITHUB_RUN_ID}-${WIDTH}-${HEIGHT}"

              agent-browser --session "$SESSION" set viewport "$WIDTH" "$HEIGHT" 1
              agent-browser --session "$SESSION" open \
                "http://127.0.0.1:4174/desktop-hud-evidence.html?width=${WIDTH}&height=${HEIGHT}"

              HUD_STATUS=""
              for attempt in {1..20}; do
                HUD_STATUS="$(agent-browser --session "$SESSION" eval 'document.documentElement.dataset.hudEvidence ?? ""')"
                if grep -Eq 'pass|fail' <<<"$HUD_STATUS"; then
                  break
                fi
                agent-browser --session "$SESSION" wait 250
              done
              printf '%s\n' "$HUD_STATUS" | tee "$STATUS_FILE"
              agent-browser --session "$SESSION" eval \
                'decodeURIComponent(document.documentElement.dataset.hudEvidenceReport ?? "")' >"$REPORT_FILE" || true

              if ! grep -q 'pass' "$STATUS_FILE"; then
                echo "Desktop HUD geometry failed at ${VIEWPORT}"
                cat "$REPORT_FILE" || true
                agent-browser --session "$SESSION" close >/dev/null 2>&1 || true
                exit 1
              fi

              agent-browser --session "$SESSION" screenshot "$SCREENSHOT"
              agent-browser --session "$SESSION" close >/dev/null 2>&1 || true
              test -s "$SCREENSHOT"

              python3 - "$SCREENSHOT" "$WIDTH" "$HEIGHT" <<'PY'
          import struct
          import sys

          path, expected_width, expected_height = sys.argv[1], int(sys.argv[2]), int(sys.argv[3])
          with open(path, "rb") as stream:
              header = stream.read(24)
          if header[:8] != b"\x89PNG\r\n\x1a\n":
              raise SystemExit(f"{path} is not a PNG")
          width, height = struct.unpack(">II", header[16:24])
          if (width, height) != (expected_width, expected_height):
              raise SystemExit(f"{path} is {width}x{height}, expected {expected_width}x{expected_height}")
          PY
            done

            cp browser-evidence/garden-fallback-1440x900.png browser-evidence/garden-fallback.png
          else
            BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
            test -n "$BROWSER"
            "$BROWSER" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --hide-scrollbars \
              --window-size=1440,1100 \
              --virtual-time-budget=5000 \
              --screenshot=browser-evidence/garden-fallback.png \
              --dump-dom \
              http://127.0.0.1:4174/ >browser-evidence/garden-dom.html
            test -s browser-evidence/garden-fallback.png
            grep -q "Eric 的秘密菜园" browser-evidence/garden-dom.html
            grep -q "本轮只升级土壤、边缘和天气" browser-evidence/garden-dom.html
          fi
      - name: Keep build and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-evidence
          path: |
            package-lock.json
            dist
            browser-evidence
          if-no-files-found: warn
          retention-days: 7
