name: Arithmetic UI Workbench
on:
  push:
    branches: [agent/arithmetic-art-ui-r1]
    paths: ['.github/workflows/arithmetic-ui-workbench.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          npm ci --no-audit --no-fund
          npm run build
          mkdir -p workbench
          git rev-parse HEAD > workbench/source.sha
          git archive HEAD -o workbench/source.tar
          tar -czf workbench/dependencies-and-build.tar.gz node_modules dist
      - uses: actions/upload-artifact@v4
        with:
          name: arithmetic-ui-source-workbench
          path: workbench
          retention-days: 1
